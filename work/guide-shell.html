const projectNotices={"en": {"heading": "About this project", "aiTitle": "How we use AI", "ai": "Torekh is an independent civic-information project built with extensive assistance from AI tools. AI helped with source research, drafting and summarising party statements, translation, design, coding and testing. Source comparisons and fact-checking also used AI assistance. AI output is not an authority or a guarantee of accuracy. Human editorial direction does not mean every item has received independent expert review. Research coverage is partial, translations remain drafts, and errors or omissions may occur. Original sources and review limits are provided so readers can check the information themselves.", "noticeTitle": "Accuracy, use and responsibility", "notice": "Torekh provides general civic information, not official election material or legal, professional or voting advice. It is independent of the Central Elections Committee and the political parties. Information may be inaccurate, incomplete, translated imperfectly or out of date. Check election procedures, final lists and ballot letters with the Central Elections Committee, and consult the linked original sources before relying on a summary. Materials are provided as is, without guarantees of accuracy, completeness, availability or fitness for a particular purpose. To the fullest extent permitted by applicable law, the publisher, editors and contributors disclaim warranties and liability for loss arising from use of or reliance on this site. Nothing in this notice excludes liability that cannot lawfully be excluded or limits mandatory legal rights. This notice is not a guarantee of personal immunity and has not been reviewed by a lawyer.", "openTitle": "Open source and reuse", "open": "Torekh is open source: https://github.com/jenniferannlove/torekh. Original application code is available under the MIT License; original editorial text and translations are available under Creative Commons Attribution 4.0 Inter function renderCoalition(){const u=cu();$('#coalition-title').textContent=u.title;$('#coalition-intro').textContent=u.intro+(['ru','am'].includes(lang)?' English coalition text pending translation review.':'');$('#coalition-context-label').textContent=u.context;$('#coalition-context').innerHTML=`<option value="off">${esc(u.off)}</option><option value="leader:netanyahu">${esc(u.netanyahu)}</option>`+active.map(p=>`<option value="${esc(p.letters)}">${esc(coalitionName(p.letters))} · ${esc(p.letters)}</option>`).join('');$('#coalition-context').value=coalitionFocus;$('#coalition-sort-label').textContent=u.sort;$('#coalition-sort').innerHTML=['official','stance','seats'].map((v,i)=>`<option value="${v}">${esc(u.orders[i])}</option>`).join('');$('#coalition-sort').value=coalitionOrder;$('#coalition-legend').textContent=u.legend;$('#coalition-builder-title').textContent=u.builder;$('#coalition-preset-label').textContent=u.preset;$('#coalition-preset').innerHTML=`<option value="custom">${esc(u.custom)}</option>`+COALITION.presets.map(x=>`<option value="${x.id}">${esc(x.label[lang]||x.label.en)}</option>`).join('');$('#coalition-clear').textContent=u.clear;$('#coalition-disclaimer').textContent=u.disclaimer;renderScenario()}
function renderScenario(){const u=cu(),picked=active.filter(p=>coalitionSelected.has(p.letters)),known=picked.filter(p=>Object.hasOwn(SEAT_POLL.seats,p.letters)),below=picked.filter(p=>Object.hasOwn(SEAT_POLL.below,p.letters)),unknown=picked.length-known.length-below.length,total=known.reduce((n,p)=>n+SEAT_POLL.seats[p.letters],0),rules=COALITION.records.filter(x=>coalitionSelected.has(x.actor)&&(coalitionSelected.has(x.target)||(x.target==='leader:netanyahu'&&coalitionFocus==='leader:netanyahu'))),refusals=rules.filter(x=>x.status==='refuse'),conditions=rules.filter(x=>x.status==='conditional'),checkedDirections=new Set(rules.filter(x=>!x.target.startsWith('leader:')).map(x=>x.actor+'|'+x.target)).size,unverified=picked.length*(picked.length-1)-checkedDirections;$('#coalition-total').innerHTML=`<strong>${esc(u.total)}: ${unknown?total+' + '+unknown+' ?':total+' / 120'}</strong><progress max="120" value="${total}" aria-label="${esc(u.total)}"></progress><p>${esc(u.majority)}: ${unknown?esc(u.unknown)+' — ?':total>=61?'✓ 61+':esc(u.short)+': '+(61-total)}</p><p>${esc(u.unknown)}: ${unknown} · ${esc(u.zero)}: ${below.length}</p><p>${picked.map(p=>esc(p.letters)).join(' · ')||'—'}</p>`;$('#coalition-warnings').innerHTML=`<p><strong>${esc(u.conflicts)}: ${refusals.length}</strong> · ${esc(u.conditions)}: ${conditions.length}</p><p>${esc(u.unchecked)}: ${unverified}</p>${refusals.length||conditions.length?`<ul>${[...refusals,...conditions].map(coalitionEvidence).join('')}</ul>`:`<p>${esc(u.none)}</p>`}`}
function coalitionSortRows(rows){if(coalitionOrder==='official')return rows;if(coalitionOrder==='seats'){const value=p=>SEAT_POLL.seats[p.letters]??(Object.hasOwn(SEAT_POLL.below,p.letters)?0:-1);return [...rows].sort((a,b)=>value(b)-value(a))}const order={leader:0,self:0,support:1,conditional:2,refuse:3,unknown:4,off:4};return [...rows].sort((a,b)=>order[relation(a).status]-order[relation(b).status])}

function card(p){const t=labels[lang],alias=aliases[p.letters]?.[lang==='ar'?1:0]||'',id=p.id;return `<article class="card" id="${esc(id)}" aria-labelledby="name-${id}"><div class="card-top"><div class="identity-check"><span>${esc(t.badge)}</span><span dir="ltr">23.10.2026</span></div>${pollBadge(p)}</div><div class="face front"><div class="ballot"><div class="letters" lang="he">${esc(p.letters)}</div><small>${esc(t.mock)}</small></div><h2 class="name" lang="${lang==='he'?'he':lang}" id="name-${id}">${esc(lang==='he'?p.name:alias)}</h2>${lang==='he'?'':`<p class="metadata">${esc(lu().reading)}</p><p class="official-name"><span>${esc(lu().officialName)}</span><br><bdi lang="he" dir="rtl">${esc(p.name)}</bdi></p>`}${coalitionBadge(p)}${identityBadges(p)}<p class="candidates"><strong>${esc(t.top)}</strong><br><span lang="he" dir="rtl">${p.candidates.map(esc).join('<br>')}</span></p><p class="source">${link(p.source,t.official)}</p>${scenarioPick(p)}<button class="primary" data-flip="${id}" aria-expanded="false">${esc(t.flip)}</button></div><div class="face back" hidden><h2 class="name" lang="${lang}" tabindex="-1">${esc(lang==='he'?p.name:alias)}</h2><div class="panel" id="${id}-panel" role="region" aria-label="${esc(t.tabs[0])}"></div><div class="back-actions"><button class="secondary" data-back="${id}">${esc(t.back)}</button><button class="secondary" data-share="${id}">${esc(t.share)}</button></div></div></article>`}
const auditUi={"he": {"source": "מקור", "checked": "נבדקה התאמת הניסוח למקורות המפלגה ב־23.10.2026. אין בכך אימות ביצוע או תוצאות. התרגומים עדיין טיוטה."}, "ar": {"source": "المصدر", "checked": "فُحص تطابق الصياغة مع مصادر القائمة في 23.10.2026. هذا لا يثبت التنفيذ أو النتائج. ما زالت الترجمات مسودات."}, "en": {"source": "Source", "checked": "Wording checked against party sources on 23 Oct 2026. This does not verify delivery or outcomes. Translations remain drafts."}, "ru": {"source": "Источник", "checked": "Формулировки сверены с источниками партии 23.10.2026. Это не подтверждает исполнение или результаты. Переводы остаются черновыми."}, "am": {"source": "ምንጭ", "checked": "Wording checked against party sources on 23 Oct 2026. Delivery and outcomes are not verified. Translations remain drafts."}};
// Every back uses fields present for all active lists. Partial policy research remains in DATA.
function panel(id){const p=active.find(p=>p.id===id),root=document.getElementById(id),t=labels[lang],box=root.querySelector('.panel');box.innerHTML=`<p class="note">${esc(t.identity)}</p><p lang="${PARTY_TRANSLATIONS.descriptions[p.letters]?.[lang]?lang:'he'}" dir="${['he','ar'].includes(lang)?'rtl':'ltr'}">${esc(PARTY_TRANSLATIONS.descriptions[p.letters]?.[lang]||p.description)}</p>${lang!=='he'?`<details class="original-source"><summary>${esc(lu().original)}</summary><p dir="rtl" lang="he">${esc(p.description)}</p></details>`:''}<p>${link(p.source,t.official)}</p>`}
function show(id,back){const root=document.getElementById(id);root.querySelector('.front').hidden=back;root.querySelector('.back').hidden=!back;root.querySelector('[data-flip]').setAttribute('aria-expanded',back);if(back){panel(id);root.querySelector('.back h2').focus()}else root.querySelector('[data-flip]').focus();root.scrollIntoView({block:'start',behavior:'instant'})}
/*HERO_COPY*/
let heroOrder=[],heroIndex=0,heroPaused=false,heroInterval=null,heroFade=null;
const heroMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)')||{matches:false,addEventListener(){}};
function heroStop(){clearInterval(heroInterval);clearTimeout(heroFade);heroInterval=null;heroFade=null;$('#hero-phrase').classList.remove('is-fading')}
function heroPaint(){const current=heroOrder[heroIndex]||lang,h=HERO_COPY[current];$('#hero-phrase').textContent=h.phrase;$('#hero-phrase').lang=current;$('#hero-phrase').dir=['he','ar'].includes(current)?'rtl':'ltr';$('#hero-language').textContent=h.language}
function heroControls(){const u=HERO_COPY[lang]||HERO_COPY.en;$('#hero-pause').hidden=heroMotion.matches;$('#hero-pause').textContent=heroPaused?u.resume:u.pause;$('#hero-pause').setAttribute('aria-pressed',String(heroPaused))}
function heroAdvance(){if(heroPaused||heroMotion.matches||document.hidden)return;$('#hero-phrase').classList.add('is-fading');heroFade=setTimeout(()=>{heroIndex=(heroIndex+1)%heroOrder.length;heroPaint();$('#hero-phrase').classList.remove('is-fading');heroFade=null},320)}
function heroStart(){heroStop();if(!heroPaused&&!heroMotion.matches)heroInterval=setInterval(heroAdvance,6000)}
function renderHero(){heroStop();heroOrder=[lang,...['he','ar','en','ru','am'].filter(x=>x!==lang)];heroIndex=0;$('#hero-static').textContent=(HERO_COPY[lang]||HERO_COPY.en).phrase.replace('\n',' ');heroPaint();heroControls();heroStart()}
$('#hero-pause').addEventListener('click',()=>{heroPaused=!heroPaused;heroControls();heroStart()});
heroMotion.addEventListener?.('change',()=>{heroStop();if(heroMotion.matches){heroIndex=0;heroPaint()}heroControls();heroStart()});

function render(){renderCoalition();renderProjectNotices();renderIdentityLegend();renderPoll();const t=labels[lang];document.documentElement.lang=lang;document.title=lu().pageTitle;document.querySelector('.header-art')?.setAttribute('alt',({ar:'رسم بالقلم لامرأتين ترتديان غطاء للرأس، تحمل كل منهما ورقة لعب واحدة.',en:'Pencil illustration of two women wearing head coverings, each holding one playing card.',he:'איור בעיפרון של שתי נשים בכיסוי ראש, כל אחת מחזיקה קלף אחד.'})[lang]||'Pencil illustration of two women holding playing cards.');$('#language').setAttribute('aria-label',lu().language);$('#cards').setAttribute('aria-label',lu().cards);$('#project-notices').setAttribute('aria-label',lu().notice);document.querySelector('.brand small').textContent=lu().brand;document.querySelector('.brand small').dir=lang==='ar'?'rtl':'ltr';document.documentElement.dir=['he','ar'].includes(lang)?'rtl':'ltr';for(const [id,key]of Object.entries({banner:'banner',lead:'lead',verification:'verified','method-title':'methodTitle',method:'method',limitations:'limitations',withdrawal:'withdrawal',footer:'footer'})){$('#'+id).textContent=t[key]}$('#lead').textContent=t.lead.replace('37',String(active.length));$('#withdrawal-update').innerHTML=esc(withdrawalUpdate[lang])+' '+link(DATA.profiles.find(p=>p.letters==='צבי').withdrawal.source,({he:'מקור',ar:'المصدر',ru:'Источник',am:'Source',en:'Source'})[lang]);$('#banner').textContent=({en:'AI-assisted',he:'בסיוע בינה מלאכותית',ar:'بمساعدة الذكاء الاصطناعي',ru:'С помощью ИИ',am:'በሰው ሰራሽ አእምሮ ድጋፍ'})[lang]+' · '+t.banner;renderHero();$('#language').value=lang;$('#guide-share').textContent=shareUi[lang].guide;$('#expect-link').textContent=({he:'מה מחכה כאן? ↗',ar:'ماذا ينتظركم؟ ↗',en:'What to expect ↗',ru:'Что вас ждёт ↗',am:'ምን መጠበቅ ትችያለሽ? ↗'})[lang];const expectLang=['ar','he','en'].includes(lang)?lang:'en';$('#expect-link').href='https://www.torekh.org/'+expectLang+'/what-to-expect?lang='+expectLang;$('#clear-search').setAttribute('aria-label',shareUi[lang].clear);$('#search').placeholder=t.search;$('#search').setAttribute('aria-label',t.search);$('#official').textContent=t.officialAll;$('#official').href=DATA.source;$('#ballots').textContent=t.ballots;$('#ballots').href=DATA.ballots;filter()}
function filter(){const q=$('#search').value.toLocaleLowerCase().trim(),exact=active.filter(p=>p.letters===q),rows=exact.length?exact:active.filter(p=>[p.name,p.letters,p.description,...p.candidates,...(aliases[p.letters]||[])].join(' ').toLocaleLowerCase().includes(q));$('#clear-search').hidden=!q;$('#count').textContent=rows.length+' / '+active.length+' '+labels[lang].count;$('#cards').innerHTML=rows.length?coalitionSortRows(rows).map(card).join(''):'<p class="empty">'+esc(labels[lang].empty)+'</p>'}

const shareUi={
he:{guide:'שיתוף המדריך ↗',heading:'מידע שכדאי להעביר הלאה',close:'סגירה',clear:'ניקוי החיפוש',link:'קישור לשיתוף',hint:'בחרו אפליקציה ובחרו למי לשתף. אפשר גם לסמן ולהעתיק את הקישור. לא נשמרת העדפת הצבעה.'},
ar:{guide:'مشاركة الدليل ↗',heading:'معلومات تستحق المشاركة',close:'إغلاق',clear:'مسح البحث',link:'رابط للمشاركة',hint:'اختاروا التطبيق ثم من تريدون المشاركة معه. يمكن أيضًا تحديد الرابط ونسخه. لا تُحفظ تفضيلات التصويت.'},
en:{guide:'Share this guide ↗',heading:'Pass the information on',close:'Close',clear:'Clear search',link:'Link to share',hint:'Choose an app, then choose whom to share with. You can also select and copy this link. No voting preference is stored.'},
ru:{guide:'Поделиться руководством ↗',heading:'Поделитесь информацией',close:'Закрыть',clear:'Очистить поиск',link:'Ссылка',hint:'Выберите приложение и получателя. Можно также выделить и скопировать ссылку. Предпочтения не сохраняются.'},
am:{guide:'መመሪያውን ያጋሩ ↗',heading:'መረጃውን ያጋሩ',close:'ዝጋ',clear:'ፍለጋውን አጽዳ',link:'የማጋሪያ አገናኝ',hint:'Choose an app and recipient, or select and copy the link. No voting preference is stored.'}
};
function openShare(p){const t=shareUi[lang],url=new URL('https://www.torekh.org/');url.searchParams.set('lang',lang);if(p)url.searchParams.set('list',p.letters);const message=(p?(lang==='he'?p.name:aliases[p.letters]?.[lang==='ar'?1:0]||p.name)+' · '+p.letters+'\n':'')+labels[lang].sharePreview;$('#share-heading').textContent=t.heading;$('#share-close').textContent=t.close;$('#share-copy').textContent=message;$('#share-url').value=url.href;$('#share-link-label').textContent=t.link;const status={"en": ["Coming soon", "Select and copy the link below to share it. WhatsApp and Telegram shortcuts are coming soon. No voting preference is stored."], "he": ["בקרוב", "אפשר לסמן ולהעתיק את הקישור למטה כדי לשתף. קיצורי השיתוף ל־WhatsApp ול־Telegram יגיעו בקרוב. לא נשמרת העדפת הצבעה."], "ar": ["قريبًا", "يمكن تحديد الرابط أدناه ونسخه لمشاركته. ستتوفر اختصارات المشاركة عبر واتساب وتلغرام قريبًا. لا تُحفظ تفضيلات التصويت."], "ru": ["Скоро", "Выделите и скопируйте ссылку ниже. Кнопки WhatsApp и Telegram появятся позже. Предпочтения при голосовании не сохраняются."], "am": ["በቅርብ ቀን", "ለማጋራት ከታች ያለውን አገናኝ ይምረጡና ይቅዱ። የWhatsApp እና Telegram አዝራሮች በቅርቡ ይመጣሉ። የድምፅ ምርጫ አይቀመጥም።"]};const copy=status[lang]||status.en;$('#share-hint').textContent=copy[1];$('#share-whatsapp').textContent='WhatsApp · '+copy[0];$('#share-telegram').textContent='Telegram · '+copy[0];$('#share-dialog').showModal()}
$('#guide-share').addEventListener('click',()=>openShare());$('#share-close').addEventListener('click',()=>$('#share-dialog').close());$('#share-url').addEventListener('click',e=>e.target.select());$('#clear-search').addEventListener('click',()=>{$('#search').value='';filter();$('#search').focus()});
window.addEventListener('message',event=>{if(configured||event.source!==parent||!['https://www.torekh.org','https://torekh.org','https://jenniferannlove-odoo.odoo.com'].includes(event.origin)||event.data?.type!=='torekh:config')return;configured=true;const config=event.data;if(['he','ar','en','ru','am'].includes(config.lang))lang=config.lang;if(typeof config.list==='string'&&active.some(p=>p.letters===config.list))$('#search').value=config.list;render()});
$('#language').addEventListener('change',e=>{lang=e.target.value;render();if(parent!==window)parent.postMessage({type:'torekh:language',lang},'*')});$('#search').addEventListener('input',filter);$('#cards').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.flip)show(b.dataset.flip,true);if(b.dataset.back)show(b.dataset.back,false);if(b.dataset.share)openShare(active.find(p=>p.id===b.dataset.share))});$('#coalition-context').addEventListener('change',e=>{coalitionFocus=e.target.value;filter();renderScenario()});$('#coalition-sort').addEventListener('change',e=>{coalitionOrder=e.target.value;filter()});$('#coalition-builder').addEventListener('toggle',()=>{document.querySelectorAll('.coalition-pick').forEach(x=>x.hidden=!$('#coalition-builder').open)});$('#cards').addEventListener('change',e=>{if(!e.target.matches('[data-coalition]'))return;const letter=e.target.dataset.coalition;if(e.target.checked)coalitionSelected.add(letter);else coalitionSelected.delete(letter);$('#coalition-preset').value='custom';renderScenario()});$('#coalition-preset').addEventListener('change',e=>{const p=COALITION.presets.find(x=>x.id===e.target.value);if(!p)return;coalitionSelected=new Set(p.members);coalitionFocus=p.context;$('#coalition-context').value=coalitionFocus;filter();renderScenario()});$('#coalition-clear').addEventListener('click',()=>{coalitionSelected.clear();$('#coalition-preset').value='custom';filter();renderScenario()});
$('#notices-jump').addEventListener('click',()=>{$('#project-notices').scrollIntoView({block:'start',behavior:'instant'});$('#project-notices summary').focus()});render();if(parent!==window)parent.postMessage({type:'torekh:ready'},'*');
</script></body></html>
