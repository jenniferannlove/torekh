let lang='he',active=0;const $=s=>document.querySelector(s);function panel(i){active=i;document.querySelectorAll('[data-tab]').forEach((b,n)=>{b.setAttribute('aria-selected',n===i);b.tabIndex=n===i?0:-1});$('#evidence').setAttribute('aria-labelledby','tab'+i);$('#evidence-title').textContent=copy[lang].heads[i];$('#evidence-body').textContent=copy[lang].bodies[i]}
function render(){document.documentElement.lang=lang;document.documentElement.dir=['he','ar'].includes(lang)?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{const text=copy[lang][el.dataset.t];el.replaceChildren(...text.split('<br>').flatMap((s,i)=>i?[document.createElement('br'),document.createTextNode(s)]:[document.createTextNode(s)]))});document.querySelectorAll('[data-tab]').forEach((b,i)=>b.textContent=copy[lang].tabs[i]);panel(active)}
$('#language').addEventListener('change',e=>{lang=e.target.value;render()});$('#flip').addEventListener('click',()=>{$('.front').hidden=true;$('.back').hidden=false;$('#flip').setAttribute('aria-expanded','true');$('#back-title').focus()});$('#unflip').addEventListener('click',()=>{$('.back').hidden=true;$('.front').hidden=false;$('#flip').setAttribute('aria-expanded','false');$('#flip').focus()});document.querySelectorAll('[data-tab]').forEach((b,i)=>{b.addEventListener('click',()=>panel(i));b.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;panel(next);$('#tab'+next).focus()}})});render();
</script></body></html>
